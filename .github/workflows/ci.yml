name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Tests, Security & Coverage
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Lockfile Integrity
        run: git diff --exit-code pnpm-lock.yaml

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high

      - name: OpenAPI Contract Diff Check
        run: pnpm openapi:check

      - name: Run i18n Translation Check
        run: pnpm i18n:check

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Unit & Integration Tests
        env:
          MONGODB_URI: "mongodb://localhost:27017/hostelhub?directConnection=true"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "hostelhub-ci-secret-32bytes-long!"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY_ID: "v1"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x0000000000000000000000AA"
        run: pnpm test

      - name: Property-Based Allocation Engine Tests
        run: pnpm --filter @hostelhub/domain test:pbt:ci

      - name: Code Coverage Gate (>= 70% on domain and service code)
        run: pnpm --filter @hostelhub/domain test:coverage

      - name: Build All Monorepo Packages
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  docker-build:
    name: Build Multi-Stage Docker Images (Web & Worker)
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: hostelhub-web:latest

      - name: Build Worker Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: hostelhub-worker:latest

  preview-e2e-lighthouse:
    name: Preview Deploy, Smoke, Axe & Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'pull_request'

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @hostelhub/web exec playwright install --with-deps chromium

      - name: Seed Database for Preview
        env:
          MONGODB_URI: "mongodb://localhost:27017/hostelhub?directConnection=true"
          REDIS_URL: "redis://localhost:6379"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY_ID: "v1"
        run: pnpm seed:synthetic

      - name: Build Preview Bundle
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @hostelhub/web build

      - name: Start Preview Server
        env:
          PORT: 3000
          MONGODB_URI: "mongodb://localhost:27017/hostelhub?directConnection=true"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "hostelhub-preview-secret-32bytes-long!"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY_ID: "v1"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x0000000000000000000000AA"
        run: |
          pnpm --filter @hostelhub/web start &
          sleep 5

      - name: Verify Preview Health & Readiness Probes
        run: |
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/ready

      - name: Run Playwright E2E Smoke & Axe Accessibility Tests
        env:
          BASE_URL: "http://localhost:3000"
        run: pnpm --filter @hostelhub/web test:e2e

      - name: Run Lighthouse CI Performance & A11y Budgets
        run: |
          npm install -g @lhci/cli@0.14.x
          pnpm --filter @hostelhub/web exec lhci autorun || true
