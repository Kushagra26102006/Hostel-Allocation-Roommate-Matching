name: OWASP ZAP Baseline Security Scan

on:
  schedule:
    # Run weekly on Sunday midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Applications
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Start Staging Stack in Background
        env:
          NODE_ENV: production
          PORT: 3000
          MONGODB_URI: "mongodb://localhost:27017/hostelhub?directConnection=true"
          REDIS_URL: "redis://localhost:6379"
          AUTH_SECRET: "hostelhub-ci-secret-32bytes-long!"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ENCRYPTION_KEY_ID: "v1"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x0000000000000000000000AA"
        run: |
          pnpm --filter @hostelhub/web start &
          sleep 5

      - name: Run OWASP ZAP Baseline Scan Script
        run: ./scripts/zap-baseline-scan.sh "http://localhost:3000" "$GITHUB_WORKSPACE/zap-reports"

      - name: Upload ZAP Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-reports
          path: zap-reports/
